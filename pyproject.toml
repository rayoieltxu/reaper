[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reaper"
version = "1.0.0"
description = "REAPER — Red team Enumeration And Pentesting Enhanced Resource"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "requests>=2.31",
    "aiofiles>=23.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "urllib3>=2.0",
]

[project.scripts]
reaper = "reaper.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["reaper*"]

[tool.setuptools.package-data]
"reaper" = ["py.typed"]
